# TTS engine configuration.
#
# Global TTS engine (used as fallback if per-language engines not specified)
# Options: "piper", "mms", "vieneu-tts"
#tts_engine = "piper"

# Per-language TTS engine configuration
# English TTS engine - "piper" recommended for high quality and performance
tts_engine_en = "piper"

# Vietnamese TTS engine - "vieneu-tts" provides Southern accent support with faster inference
# Alternative options: "mms", "piper"
# Note: vieneu-tts requires eSpeak NG to be installed on your system
tts_engine_vi = "vieneu-tts"

# ASR (Automatic Speech Recognition) model configuration for Vietnamese.
#
# Options:
# "openai/whisper-small"               - Multilingual Whisper model, good for all dialects (~1GB VRAM)
# "dragonSwing/wav2vec2-base-vn-270h" - Vietnamese-specific model, lightweight (alternative option)
#
# Note: whisper-small is recommended as it provides good accuracy and consistency
# with the English ASR model while supporting southern Vietnamese dialect.
vietnamese_asr_model = "openai/whisper-small"